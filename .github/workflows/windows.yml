name: Windows executable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-sqlite3
      - name: Locate source directory
        shell: pwsh
        run: |
          $source = if (Test-Path source/CMakeLists.txt) { 'source' } else { '.' }
          "LINTHESIA_SOURCE=$((Resolve-Path $source).Path)" >> $env:GITHUB_ENV
      - name: Build portable executable
        shell: pwsh
        run: |
          & "$env:LINTHESIA_SOURCE/build-windows.ps1" -MsysRoot '${{ steps.msys2.outputs.msys2-location }}'
      - name: Check packaged executable without MSYS2 on PATH
        shell: pwsh
        run: |
          & "$env:LINTHESIA_SOURCE/tests/check-windows-package.ps1" `
            -PackageRoot (Join-Path $env:LINTHESIA_SOURCE 'dist/windows-x64/Linthesia') `
            -PortableCorePath (Join-Path $env:LINTHESIA_SOURCE 'build-windows/PortableCore.exe') `
            -ObjdumpPath '${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin/objdump.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: Linthesia-windows-x64
          path: ${{ env.LINTHESIA_SOURCE }}/dist/windows-x64/Linthesia-windows-x64.zip
          if-no-files-found: error
